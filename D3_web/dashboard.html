<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Dance4Life Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
    h1 { text-align: center; }

    #search-area { text-align: center; margin: 20px 0; }
    #search-area input { padding: 8px; width: 200px; font-size: 16px; }
    #search-area button { padding: 8px 16px; font-size: 16px; cursor: pointer; }

    #user-card {
      display: none;
      background: white; border-radius: 8px;
      padding: 20px; margin: 20px auto;
      max-width: 500px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }

    #charts { display: flex; gap: 40px; justify-content: center; flex-wrap: wrap; margin: 30px 0; }

    #output { margin-top: 30px; }
    table { border-collapse: collapse; width: 100%; background: white; }
    th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
    th { background: #333; color: white; }
    tr.top1 { background: #FFD700; }
    tr.top2 { background: #C0C0C0; }
    tr.top3 { background: #CD7F32; color: white; }
    tr:hover { background: #e8f4ff; cursor: pointer; }

    .tab-btn {
      padding: 10px 20px;
      font-size: 15px;
      cursor: pointer;
      border: 2px solid #333;
      background: white;
      border-radius: 6px;
    }
    .tab-btn.active {
      background: #333;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Dance4Life Dashboard</h1>

  <div id="search-area">
    <input type="text" id="search-input" placeholder="Ex: user_0100" />
    <button onclick="searchUser()">Pesquisar</button>
  </div>

  <div id="user-card">
    <h2 id="card-name"></h2>
    <p>🏅 Posição: <strong id="card-rank"></strong></p>
    <p>⭐ Score: <strong id="card-score"></strong></p>
    <p>🏃 Atividades: <strong id="card-activity"></strong></p>
    <p>📨 Convites: <strong id="card-inv"></strong></p>
    <p>✅ Aceites: <strong id="card-accepted"></strong></p>
    <p>🤝 Matchings: <strong id="card-matching"></strong></p>
    <p>💡 Recomendações: <strong id="card-rec"></strong></p>
    <svg id="pie-chart"></svg>
  </div>

  <!-- TABS -->
  <div id="tabs" style="display:flex; gap:10px; justify-content:center; margin: 30px 0 0 0;">
    <button class="tab-btn" onclick="showTab('tab-ranking')" id="btn-ranking">🏆 Ranking</button>
    <button class="tab-btn" onclick="showTab('tab-timeline')" id="btn-timeline">📈 Temporal</button>
    <button class="tab-btn" onclick="showTab('tab-map')" id="btn-map">🗺️ Cidades</button>
    <button class="tab-btn" onclick="showTab('tab-invites')" id="btn-invites">📊 Convites</button>
  </div>

  <!-- TAB RANKING -->
  <div id="tab-ranking">
    <div id="charts">
      <div>
        <h3 style="text-align:center">Top 10 Utilizadores</h3>
        <svg id="bar-chart"></svg>
      </div>
    </div>
    <div id="output"></div>
  </div>

  <!-- TAB TEMPORAL -->
  <div id="tab-timeline" style="display:none; text-align:center;">
    <h3>Atividade ao longo do tempo</h3>
    <svg id="timeline-chart"></svg>
  </div>

  <!-- TAB CIDADES -->
  <div id="tab-map" style="display:none; text-align:center;">
    <h3>Atividades por Cidade</h3>
    <div id="map-chart" style="height: 500px; width: 90%; margin: 0 auto; border-radius: 8px;"></div>
  </div>

  <!-- TAB CONVITES -->
  <div id="tab-invites" style="display:none; text-align:center;">
    <h3>Distribuição de Convites</h3>
    <svg id="invites-chart"></svg>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="dashboard.js"></script>
</body>
</html>
